# Cloudflare Workers con archivos estáticos: worker.js protege con contraseña y atiende /api;
# el resto se sirve desde la raíz del repositorio (lo listado en .assetsignore no se publica).
name = "planoexactocr"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
