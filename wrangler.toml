# Cloudflare Workers con archivos estáticos: worker.js atiende cuentas, administración y /api;
# el resto se sirve desde la raíz del repositorio (lo listado en .assetsignore no se publica).
name = "planoexactocr"
main = "worker.js"
compatibility_date = "2026-10-01"

# Dominio propio: el sitio vive en planoexactocr.com; la dirección workers.dev y www redirigen allí.
routes = [
  { pattern = "planoexactocr.com", custom_domain = true },
  { pattern = "www.planoexactocr.com", custom_domain = true }
]
[vars]
DOMINIO = "planoexactocr.com"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

# Lista de espera previa (correo, perfil, cupón). Cloudflare crea el espacio la primera vez que se publica.
[[kv_namespaces]]
binding = "REGISTROS"

# Cuentas de usuario (correo, contraseña cifrada, plan). Cloudflare crea la base la primera vez que se publica;
# el Worker crea las tablas solo.
[[d1_databases]]
binding = "DB"
database_name = "planoexactocr-usuarios"
