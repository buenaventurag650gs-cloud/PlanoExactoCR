<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PlanoExactoCR · decodificar tile de SUTEL/MedUX</title>
<style>
body { font: 14px/1.5 system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #15302A; }
input { width: 100%; padding: 8px; font: 13px monospace; box-sizing: border-box; margin-bottom: 8px; }
button { padding: 8px 14px; font-weight: 600; cursor: pointer; }
pre { background: #F2F1EC; padding: 12px; border-radius: 8px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.err { color: #B42318; }
</style>
</head>
<body>
<h1>Decodificar un tile vectorial (.pbf) de SUTEL/MedUX</h1>
<p>Pegá la URL completa del tile (la que viste en la pestaña Red del navegador) y hacé clic en «Decodificar». Esto corre en tu navegador, no en el servidor.</p>
<input id="url" value="https://medux-maps-tiles-int.caseonit.net/data/costa_rica_4_kolbi_cr_2025_network/8/67/121.pbf">
<button id="go">Decodificar</button>
<p id="estado"></p>
<pre id="out"></pre>

<script src="https://cdn.jsdelivr.net/npm/pbf@3.2.1/dist/pbf.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mapbox/vector-tile@1.3.1/dist/vector-tile.js"></script>
<script>
document.getElementById('go').onclick = async () => {
  const url = document.getElementById('url').value.trim();
  const estado = document.getElementById('estado'), out = document.getElementById('out');
  estado.textContent = 'Descargando…'; estado.className = ''; out.textContent = '';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    estado.textContent = 'Descargado: ' + buf.byteLength + ' bytes. Decodificando…';
    const VT = (typeof VectorTile !== 'undefined' && VectorTile) || (window.vectorTile && window.vectorTile.VectorTile);
    if (!VT) throw new Error('No se pudo cargar la librería VectorTile (revisá la consola por errores de red).');
    const pbf = new Pbf(new Uint8Array(buf));
    const tile = new VT(pbf);
    const resumen = {};
    for (const nombreCapa in tile.layers) {
      const capa = tile.layers[nombreCapa];
      const n = capa.length;
      const muestras = [];
      for (let i = 0; i < Math.min(5, n); i++) {
        const f = capa.feature(i);
        muestras.push({ tipo_geom: f.type, propiedades: f.properties });
      }
      resumen[nombreCapa] = { total_features: n, extent: capa.extent, muestras };
    }
    estado.textContent = 'Listo — ' + Object.keys(resumen).length + ' capa(s) dentro del tile.';
    out.textContent = JSON.stringify(resumen, null, 2);
  } catch (e) {
    estado.textContent = 'Error:';
    estado.className = 'err';
    out.textContent = String(e);
  }
};
</script>
</body>
</html>
