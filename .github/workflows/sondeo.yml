name: Sondeo de fuentes
on: workflow_dispatch
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Probar el catastro del SNIT
        run: |
          U="www.snitcr.go.cr/Visor/services/siri?tipoquery=plano&plano=613116112008"
          for v in "https://$U" "http://$U" "-k https://$U" "https://geos.snitcr.go.cr/be/IGN_5/wms?service=WMS&request=GetCapabilities"; do
            err=$(curl -sS -o /tmp/r -w "%{http_code}" --max-time 40 $v 2>&1 | tr -d '\n' | tr ':' ' ')
            echo "::notice title=sondeo::[$v] $err $(head -c 120 /tmp/r 2>/dev/null | tr -d '\n\r:')"
          done
          echo | openssl s_client -connect www.snitcr.go.cr:443 -servername www.snitcr.go.cr 2>/dev/null | grep -E "Verify return|depth|s:|i:" | head -8 | tr ':' ' ' | while read l; do echo "::notice title=tls::$l"; done
