name: Actualizar remates
on:
  schedule:
    - cron: '23 13 * * 1-5'   # lunes a viernes, 7:23 a. m. hora de Costa Rica (el Boletín sale en la madrugada)
  workflow_dispatch:
permissions:
  contents: write
concurrency: actualizar
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: pip install --quiet shapely==2.0.6 pyproj==3.7.0 requests
      - name: Leer el Boletín Judicial y actualizar los datos
        run: python3 scripts/actualizar.py
      - name: Guardar cambios (Cloudflare publica solo)
        run: |
          git config user.name "PlanoExactoCR (actualización)"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos: actualización diaria $(date -u +%F)"
          git push
