<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Expediente · PlanoExactoCR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Montserrat:wght@300;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>
/* Expediente: hojas carta horizontal (1000 × 760 px). Hoja 1 lámina cartográfica; hoja 2 ficha; hoja 3 riesgos, verificación y edicto. */
body { background: var(--bg); }
.bar0 { position: sticky; top: 0; z-index: 1000; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar0 .brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.bar0 .wm { font-size: 17px; }
.cur { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.cur button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.cur button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.doc { padding: 20px 16px 48px; display: grid; gap: 20px; justify-items: center; }
.wall { max-width: 560px; margin: 40px auto; display: grid; gap: 14px; }
.wall h1 { margin: 0; font: 700 24px/1.2 var(--f-display); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.demo { font-size: 12px; color: var(--warn); background: var(--warnbg); border-radius: 8px; padding: 8px 10px; }
.legal.screen-only { max-width: 1000px; }

/* Hoja (papel: colores fijos, no cambian con el tema) */
.page { --ink: #15302A; --muted: #55635D; --line: #DCD8CE; --chip: #EFECE4; --accent: #1F5A47; --warn: #8A4B00; --warnbg: #FCF1DE; --mark-bg: transparent; --brand: #15302A; --brand-green: #539279;
  width: 1000px; min-height: 760px; background: #FFFFFF; color: #15302A; border-radius: 6px; box-shadow: 0 8px 28px rgba(20, 35, 30, .16); padding: 18px 22px 12px; display: flex; flex-direction: column; gap: 12px; font-size: 12.5px; line-height: 1.45; }
.lamina { height: 760px; }
.ph { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; border-bottom: 2px solid #15302A; padding-bottom: 8px; }
.lbrand { display: flex; align-items: center; gap: 6px; }
.lbrand .mark img { width: 40px; height: auto; }
.lbrand .wm { font-size: 14px; }
.pt { display: grid; } .pt b { font: 600 18px/1.2 var(--f-display); } .pt span { color: #55635D; }
.pm { text-align: right; display: grid; color: #55635D; font-size: 11.5px; } .pm b { color: #15302A; font-size: 12px; }
.pf { margin-top: auto; display: flex; justify-content: space-between; gap: 16px; font-size: 10px; color: #7B8782; border-top: 1px solid #DCD8CE; padding-top: 6px; }
.money .u { color: #1F5A47; }
.duo .eq, .duo .eq .u { color: #55635D; }

/* Lámina */
.lbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 630px 1fr; gap: 14px; }
.lmapcol { display: grid; grid-template-rows: 1fr auto; gap: 8px; min-height: 0; }
.lmapwrap { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #B9B4A7; min-height: 0; background: #3A4A44; }
.lmap { position: absolute; inset: 0; background: #3A4A44; }
.nflecha { position: absolute; top: 8px; left: 8px; z-index: 500; background: rgba(255, 255, 255, .92); border-radius: 6px; padding: 3px 5px 1px; }
.lmapwrap .leaflet-top.leaflet-left { top: 44px; }
.leaflet-control-scale-line { font-size: 10px; background: rgba(255, 255, 255, .9); border-color: #15302A; color: #15302A; }
.inset { position: absolute; z-index: 600; border: 2px solid #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); background: #3A4A44; }
.inset.det { top: 8px; right: 8px; width: 210px; height: 170px; }
.inset.loc { bottom: 8px; right: 8px; width: 150px; height: 112px; background: #DCE5E2; }
.inset.loc .lmap { background: #DCE5E2; }
.ilab { position: absolute; left: 0; right: 0; bottom: 0; z-index: 700; background: rgba(21, 48, 42, .85); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-cat { filter: grayscale(1) brightness(.55) contrast(1.6); opacity: .45; }
.on-sat .tl-cat { filter: grayscale(1) brightness(2.6); opacity: .75; }
.tl-vias { filter: grayscale(1) brightness(1.7) contrast(.9); opacity: .6; }
.tl-hill { mix-blend-mode: multiply; }
.lrad { color: #55635D !important; text-shadow: 0 0 3px #fff, 0 0 3px #fff !important; }
.lmap { background: #F2F1EC !important; }
.inset.det .lmap { background: #3A4A44 !important; }
.lleg { position: absolute; left: 8px; bottom: 8px; z-index: 500; background: rgba(21, 48, 42, .86); color: #fff; border-radius: 6px; padding: 7px 10px; display: grid; gap: 3px; font-size: 10.5px; max-width: 290px; }
.lleg span { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lleg .sw { width: 15px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.lleg .ln { width: 17px; height: 0; display: inline-block; flex: none; }
.nb { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: #fff; color: #15302A; font: 700 9px/1 var(--f-body); font-style: normal; flex: none; }
.lnum { display: grid !important; place-items: center; border-radius: 50%; background: #15302A; color: #fff; font: 700 11px/1 var(--f-body); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.lnum.p { background: #C8553D; }
.ltip { background: rgba(255, 255, 255, .92); border: 0; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); padding: 2px 6px; font: 600 10.5px/1.3 var(--f-body); color: #15302A; }
.ltip::before { display: none; }
.lrad { color: #fff; font: 700 10px/14px var(--f-body); text-align: center; text-shadow: 0 0 3px rgba(0,0,0,.9); }
.lvars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.lvars div { background: #EFECE4; border-radius: 5px; padding: 4px 8px; display: grid; min-width: 0; }
.lvars small { color: #55635D; font-size: 10px; }
.lvars b { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvars .w { background: #FBE6DC; } .lvars .w b { color: #A2462A; }
.lside { display: flex; flex-direction: column; gap: 9px; min-height: 0; }
.ldatos { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.ldatos div { background: #EFECE4; border-radius: 6px; padding: 5px 9px; display: grid; gap: 1px; min-width: 0; }
.ldatos .w { grid-column: 1 / -1; background: #E3EFE8; }
.ldatos small { color: #55635D; font-size: 10.5px; }
.ldatos b { font-size: 13.5px; font-weight: 600; }
.ldatos .w b { font-size: 18px; }
.ldatos .duo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ldatos .duo .eq { font-size: .72em; }
.lidx { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: center; border: 1px solid #DCD8CE; border-radius: 6px; padding: 4px 8px; }
.lscore { display: grid; justify-items: center; text-align: center; gap: 1px; }
.lscore .score.big { width: 70px; height: 70px; font-size: 24px; --accent: #1F5A47; --chip: #E6E2D8; }
.lscore .score.big::after { inset: 7px; background: #fff; }
.lscore b { font-size: 12px; } .lscore small { color: #55635D; font-size: 9px; letter-spacing: .05em; text-transform: uppercase; }
.radar { width: 100%; max-height: 120px; }
.radar .rg { fill: none; stroke: #CFCABD; stroke-width: .6; }
.radar .rv { fill: rgba(83, 146, 121, .35); stroke: #1F5A47; stroke-width: 1.6; }
.radar .rl { font: 600 8.5px var(--f-body); fill: #55635D; } .radar .rn { fill: #15302A; font-weight: 700; }
.lpot, .lrie { flex: 1; border-radius: 6px; padding: 7px 10px; display: flex; flex-direction: column; gap: 5px; min-height: 0; overflow: hidden; }
.lpot { background: #E7F2EC; } .lrie { background: #FBEDE6; }
.lpot h3, .lrie h3 { margin: 0; font: 700 11px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: #1F5A47; }
.lrie h3 { color: #A2462A; } .lrie h3 small { font-weight: 600; letter-spacing: 0; text-transform: none; color: #55635D; margin-left: 4px; }
.lpot div, .lrie div, .rl div { display: grid; grid-template-columns: 17px 1fr; gap: 7px; line-height: 1.38; font-size: 11.5px; }
.lpot div, .lrie div { font-size: 11px; line-height: 1.32; }
.edicto.cols2 { column-count: 2; column-gap: 26px; font-size: 11px; }
.lpot i, .lrie i, .rl i { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font: 700 10px/1 var(--f-body); font-style: normal; color: #fff; background: #2E7D5B; margin-top: 1px; }
.lrie i, .rl .r3 i { background: #C8553D; } .lrie .n2 i, .rl .r2 i { background: #D98A5F; } .lrie .n1 i, .rl .r1 i { background: #8A948F; }

/* Hojas 2 y 3 */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; flex: 1; }
.col { display: grid; gap: 14px; align-content: start; }
.blk h2 { margin: 0 0 6px; font: 700 11.5px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: #1F5A47; border-bottom: 1px solid #DCD8CE; padding-bottom: 4px; }
.blk h2 small { font-weight: 500; text-transform: none; letter-spacing: 0; color: #55635D; }
.blk p { margin: 4px 0 0; }
.tb { width: 100%; border-collapse: collapse; }
.tb th, .tb td { text-align: left; padding: 4px 6px; border-top: 1px solid #E6E2D8; vertical-align: top; }
.tb th { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #55635D; border-top: 0; }
.tb .n { text-align: right; } .tb .duo { justify-items: end; }
.tb tr.now td { background: #E3EFE8; } .tb tr.past td { color: #8A948F; }
dl.kv.sm { grid-template-columns: 112px 1fr; gap: 3px 10px; margin-top: 8px; }
.raw { font-size: 11.5px; color: #55635D; background: #EFECE4; padding: 6px 8px; border-radius: 5px; }
.gl { display: grid; gap: 4px; margin-top: 6px; font-size: 11.5px; } .gl div { border-left: 3px solid #D98A5F; padding-left: 8px; }
.ok { color: #1F5A47; font-weight: 600; }
.k4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.k4 div { background: #EFECE4; border-radius: 5px; padding: 5px 8px; display: grid; } .k4 small { color: #55635D; font-size: 10px; } .k4 b { font-size: 14px; }
.note2 { font-size: 10.5px; color: #7B8782; }
.dm { display: grid; gap: 3px; margin-bottom: 8px; }
.dmh { display: flex; justify-content: space-between; } .dmh span { font-weight: 700; }
.dm .track { height: 7px; border-radius: 4px; background: #E6E2D8; overflow: hidden; } .dm .track i { display: block; height: 100%; background: #1F5A47; border-radius: 4px; }
.dm p { margin: 0; font-size: 11px; color: #55635D; }
.rl { display: grid; gap: 7px; } .rl em { font-style: normal; font-size: 10px; font-weight: 600; color: #7B8782; text-transform: uppercase; letter-spacing: .05em; }
.chk { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.edicto { font-size: 10.5px; line-height: 1.5; color: #3C4A45; text-align: justify; }

@media screen and (max-width: 1040px) {
  .page { width: 100%; min-height: 0; height: auto; padding: 14px; }
  .lamina { height: auto; }
  .lbody, .cols { grid-template-columns: 1fr; }
  .lmapwrap { height: 520px; }
  .lvars { grid-template-columns: 1fr 1fr; }
  .ph { grid-template-columns: 1fr; } .pm { text-align: left; }
  .inset.det { width: 150px; height: 120px; }
}
@page { size: letter landscape; margin: 8mm; }
@media print {
  html, body { background: #fff; }
  .bar0, .screen-only { display: none !important; }
  .doc { padding: 0; gap: 0; display: block; }
  .page { width: 994px; min-height: 748px; box-shadow: none; border-radius: 0; padding: 0; break-after: page; }
  .lamina { height: 748px; }
  .page * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { font-size: 11.3px; line-height: 1.38; gap: 8px; }
  .cols { gap: 18px; } .col { gap: 9px; }
  .blk h2 { margin-bottom: 4px; }
  .tb th, .tb td { padding: 2px 5px; }
  dl.kv.sm { gap: 2px 10px; margin-top: 5px; }
  .raw, .gl, .dm p, .note2 { font-size: 10.3px; }
  .dm { margin-bottom: 5px; }
}
/* Tablita PECR en papel */
.ptab { font-size: 10.5px; margin-top: 4px; } .ptab th, .ptab td { padding: 2px 5px; }
.vd.in { background: #DFEDE6; color: #1F5A47; } .vd.lo { background: #E3F1E7; color: #2E7D4F; } .vd.hi { background: #FBE4DF; color: #B42318; }
</style>
</head>
<body>
<div class="bar0">
  <span class="brand"><span class="mark"><img src="assets/img/logo-mark.webp" alt="" width="42" height="30"></span><span class="wm"><span class="w1">PLANO</span><span class="w2">EXACTO</span><span class="w3">CR</span></span></span>
  <a class="btn sm" href="index.html" id="back">← Volver al mapa</a>
  <div class="cur" role="group" aria-label="Moneda"><button id="cCRC" aria-pressed="true">₡</button><button id="cUSD" aria-pressed="false">US$</button></div>
  <button class="btn sm primary" id="print">Imprimir o guardar PDF</button>
</div>
<main id="doc" class="doc" aria-live="polite"><p class="muted">Cargando expediente…</p></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/core.js"></script>
<script src="assets/pro.js"></script>
<script src="assets/lamina.js"></script>

</body>
</html>
