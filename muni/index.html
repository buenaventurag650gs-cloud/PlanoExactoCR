<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atlas municipal — PlanoExacto</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --ink:#e6edf3; --muted:#8b949e; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  #app { display:grid; grid-template-columns: 300px 1fr; height:100%; }
  #panel { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  #panel h1 { font-size:15px; margin:0 0 4px; }
  #panel p.sub { color:var(--muted); margin:0 0 14px; font-size:12px; }
  select, button { width:100%; padding:7px 8px; margin-bottom:10px; background:#0e1116; color:var(--ink); border:1px solid var(--line); border-radius:6px; font-size:13px; }
  button { background:var(--accent); border:none; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 10px; padding:8px 10px; }
  legend { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:0 4px; }
  label.capa { display:flex; align-items:flex-start; gap:7px; padding:4px 0; font-size:13px; cursor:pointer; }
  label.capa input { margin-top:3px; }
  label.capa.pendiente { color:var(--muted); cursor:default; }
  label.capa .tag { font-size:10px; border-radius:4px; padding:1px 5px; margin-left:auto; white-space:nowrap; }
  .tag.disponible { background:#1f6feb33; color:#58a6ff; }
  .tag.pendiente { background:#8b949e22; color:var(--muted); }
  #map { height:100%; position:relative; }
  #avisos { position:absolute; top:12px; right:12px; z-index:1000; display:flex; flex-direction:column; gap:6px; max-width:320px; }
  #avisos .aviso { background:#2d1b0e; border:1px solid #f0883e; color:#ffd8a8; font-size:12px; padding:8px 10px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  #fuentes { font-size:11px; color:var(--muted); border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  #fuentes div { margin-bottom:3px; }
  @media print {
    #panel { display:none; }
    #app { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>Atlas municipal</h1>
    <p class="sub">Capas para plan regulador e IFA — uso interno del equipo.</p>

    <select id="selCanton"><option value="">Cantón…</option></select>
    <button id="btnAtlas" disabled>Generar atlas del cantón (PDF)</button>

    <div id="grupos"></div>

    <div id="fuentes"></div>
  </div>
  <div id="map">
    <div id="avisos"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
