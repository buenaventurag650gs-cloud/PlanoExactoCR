<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo azul oscuro (igual que el panel del atlas) -->
  <rect width="100" height="100" rx="18" fill="#161b22"/>

  <!-- Círculo del globo -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Meridiano vertical -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="white" stroke-width="1.8"/>

  <!-- Paralelo horizontal (ecuador) -->
  <line x1="18" y1="50" x2="82" y2="50" stroke="white" stroke-width="1.8"/>

  <!-- Paralelo superior -->
  <path d="M 23 34 Q 50 28 77 34" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Paralelo inferior -->
  <path d="M 23 66 Q 50 72 77 66" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Meridiano izquierdo (elipse) -->
  <path d="M 50 18 Q 30 50 50 82" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Meridiano derecho (elipse) -->
  <path d="M 50 18 Q 70 50 50 82" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Punto de ubicación (pin) -->
  <circle cx="58" cy="44" r="5" fill="#4f8cff"/>
  <circle cx="58" cy="44" r="2.5" fill="white"/>
</svg>
